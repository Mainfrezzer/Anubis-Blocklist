name: Update Anubis blocklists

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: write

jobs:
  update-blocklists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python YAML
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Generate blocklists
        env:
          CONFIG: config/providers.yml
          OUTPUT_DIR: anubis/list
        run: |
          set -euo pipefail

          mkdir -p "$OUTPUT_DIR"

          python3 <<'PY'
          import json
          import os
          import re
          import time
          import urllib.request

          import yaml

          config_file = os.environ["CONFIG"]
          output_dir = os.environ["OUTPUT_DIR"]

          with open(config_file, "r", encoding="utf-8") as f:
              config = yaml.safe_load(f)

          providers = config.get("providers", [])

          if not providers:
              raise SystemExit("No providers configured")

          def get_json(url, retries=4, timeout=120):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "anubis-blocklist-generator/1.0",
                      "Accept": "application/json",
                  },
              )

              last_error = None

              for attempt in range(1, retries + 1):
                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=timeout,
                      ) as response:
                          return json.load(response)

                  except Exception as exc:
                      last_error = exc

                      if attempt == retries:
                          break

                      delay = 2 ** (attempt - 1)

                      print(
                          f"Request failed (attempt {attempt}/{retries}): "
                          f"{exc}",
                          flush=True,
                      )
                      print(f"Retrying in {delay}s...", flush=True)

                      time.sleep(delay)

              raise RuntimeError(
                  f"Failed to fetch {url} after {retries} attempts"
              ) from last_error

          def slugify(value):
              value = value.lower()
              value = re.sub(r"[^a-z0-9]+", "-", value)
              value = re.sub(r"-+", "-", value)
              return value.strip("-")

          all_prefixes = set()

          # Generate into a temporary directory.
          # Existing blocklists remain untouched until generation succeeds.
          temp_dir = os.path.join(output_dir, ".generated")

          os.makedirs(temp_dir, exist_ok=True)

          generated_files = set()
          used_slugs = set()

          for provider in providers:
              provider_name = provider["name"]
              asns = provider["asns"]

              provider_prefixes = set()
              holder_names = []

              for configured_asn in asns:
                  asn = str(configured_asn).upper()

                  if not asn.startswith("AS"):
                      asn = "AS" + asn

                  if not re.fullmatch(r"AS[0-9]+", asn):
                      print(
                          f"WARNING: Invalid ASN {configured_asn}, skipping",
                          flush=True,
                      )
                      continue

                  print(f"Fetching {asn}", flush=True)

                  prefixes_url = (
                      "https://stat.ripe.net/data/"
                      f"announced-prefixes/data.json?resource={asn}"
                  )

                  # Fetch prefixes independently.
                  try:
                      prefixes_data = get_json(prefixes_url)

                      prefixes = {
                          item["prefix"]
                          for item in prefixes_data.get(
                              "data", {}
                          ).get("prefixes", [])
                          if isinstance(item, dict)
                          and item.get("prefix")
                      }

                  except Exception as exc:
                      print(
                          f"  ERROR fetching prefixes for {asn}: {exc}",
                          flush=True,
                      )
                      print(f"  Skipping {asn}", flush=True)
                      continue

                  if not prefixes:
                      print(
                          f"  No announced prefixes for {asn}, skipping",
                          flush=True,
                      )
                      continue

                  provider_prefixes.update(prefixes)
                  all_prefixes.update(prefixes)

                  # Overview is optional.
                  try:
                      overview_url = (
                          "https://stat.ripe.net/data/"
                          f"as-overview/data.json?resource={asn}"
                      )

                      overview = get_json(overview_url)

                      holder = overview.get("data", {}).get("holder")

                      if holder:
                          holder_names.append(holder)

                  except Exception as exc:
                      print(
                          f"  WARNING: Could not retrieve overview "
                          f"for {asn}: {exc}",
                          flush=True,
                      )

                  print(
                      f"  {len(prefixes)} prefixes",
                      flush=True,
                  )

              # Skip providers without successfully retrieved prefixes.
              if not provider_prefixes:
                  print(
                      f"Skipping provider {provider_name}: "
                      "no prefixes retrieved successfully",
                      flush=True,
                  )
                  continue

              # Prefer the AS holder returned by RIPEstat.
              # Fall back to the configured provider name.
              if holder_names:
                  rule_name_source = holder_names[0]
              else:
                  rule_name_source = provider_name

              base_slug = slugify(rule_name_source)

              if not base_slug:
                  base_slug = slugify(provider_name)

              if not base_slug:
                  base_slug = "provider"

              # Ensure every provider gets a unique filename.
              slug = base_slug
              counter = 2

              while slug in used_slugs:
                  slug = f"{base_slug}-{counter}"
                  counter += 1

              used_slugs.add(slug)

              filename = f"{slug}.yaml"
              filepath = os.path.join(temp_dir, filename)

              rule = [
                  {
                      "name": f"anti {slug}",
                      "action": "CHALLENGE",
                      "challenge": {
                          "difficulty": 64,
                          "algorithm": "fast",
                      },
                      "remote_addresses": sorted(provider_prefixes),
                  }
              ]

              with open(filepath, "w", encoding="utf-8") as f:
                  yaml.safe_dump(
                      rule,
                      f,
                      sort_keys=False,
                      default_flow_style=False,
                  )

              generated_files.add(filename)

              print(
                  f"Generated {filename}: "
                  f"{len(provider_prefixes)} unique prefixes",
                  flush=True,
              )

          # Generate one combined blocklist.
          combined = [
              {
                  "name": "anti all configured providers",
                  "action": "CHALLENGE",
                  "challenge": {
                      "difficulty": 64,
                      "algorithm": "fast",
                  },
                  "remote_addresses": sorted(all_prefixes),
              }
          ]

          combined_file = os.path.join(temp_dir, "blocklist.yaml")

          with open(combined_file, "w", encoding="utf-8") as f:
              yaml.safe_dump(
                  combined,
                  f,
                  sort_keys=False,
                  default_flow_style=False,
              )

          generated_files.add("blocklist.yaml")

          print(
              f"Generated blocklist.yaml: "
              f"{len(all_prefixes)} unique prefixes",
              flush=True,
          )

          if not all_prefixes:
              raise SystemExit(
                  "ERROR: No prefixes retrieved from any provider. "
                  "Existing blocklists will be preserved."
              )

          # Validate all generated YAML before replacing existing files.
          for filename in sorted(generated_files):
              filepath = os.path.join(temp_dir, filename)

              with open(filepath, "r", encoding="utf-8") as f:
                  data = yaml.safe_load(f)

              if not isinstance(data, list):
                  raise SystemExit(
                      f"{filename}: root must be a list"
                  )

              for rule in data:
                  if not isinstance(rule, dict):
                      raise SystemExit(
                          f"{filename}: rule must be a mapping"
                      )

                  required_root = [
                      "name",
                      "action",
                      "challenge",
                      "remote_addresses",
                  ]

                  for key in required_root:
                      if key not in rule:
                          raise SystemExit(
                              f"{filename}: missing {key}"
                          )

                  if rule["action"] != "CHALLENGE":
                      raise SystemExit(
                          f"{filename}: invalid action"
                      )

                  if not isinstance(rule["remote_addresses"], list):
                      raise SystemExit(
                          f"{filename}: remote_addresses is not a list"
                      )

                  challenge = rule["challenge"]

                  if not isinstance(challenge, dict):
                      raise SystemExit(
                          f"{filename}: challenge must be a mapping"
                      )

                  for key in ["difficulty", "algorithm"]:
                      if key not in challenge:
                          raise SystemExit(
                              f"{filename}: challenge is missing {key}"
                          )

                  if challenge["difficulty"] != 64:
                      raise SystemExit(
                          f"{filename}: invalid difficulty"
                      )

                  if challenge["algorithm"] != "fast":
                      raise SystemExit(
                          f"{filename}: invalid algorithm"
                      )

          print("Generated YAML validation successful", flush=True)

          # Verify all files exist before touching existing blocklists.
          for filename in generated_files:
              source = os.path.join(temp_dir, filename)

              if not os.path.isfile(source):
                  raise SystemExit(
                      f"ERROR: Generated file is missing: {source}"
                  )

          # Replace existing blocklists only after successful generation.
          for filename in os.listdir(output_dir):
              filepath = os.path.join(output_dir, filename)

              if (
                  filename.endswith(".yaml")
                  and os.path.isfile(filepath)
              ):
                  os.remove(filepath)

          for filename in sorted(generated_files):
              source = os.path.join(temp_dir, filename)
              destination = os.path.join(output_dir, filename)

              os.replace(source, destination)

          # Remove temporary directory.
          os.rmdir(temp_dir)

          print(
              f"Successfully updated {len(generated_files)} blocklist files",
              flush=True,
          )
          PY

      - name: Validate YAML
        run: |
          set -euo pipefail

          python3 <<'PY'
          import glob
          import yaml

          files = glob.glob("anubis/list/*.yaml")

          if not files:
              raise SystemExit("No YAML files generated")

          for filename in files:
              print(f"Checking {filename}")

              with open(filename, "r", encoding="utf-8") as f:
                  data = yaml.safe_load(f)

              if not isinstance(data, list):
                  raise SystemExit(
                      f"{filename}: root must be a list"
                  )

              for rule in data:
                  if not isinstance(rule, dict):
                      raise SystemExit(
                          f"{filename}: rule must be a mapping"
                      )

                  required_root = [
                      "name",
                      "action",
                      "challenge",
                      "remote_addresses",
                  ]

                  for key in required_root:
                      if key not in rule:
                          raise SystemExit(
                              f"{filename}: missing {key}"
                          )

                  if rule["action"] != "CHALLENGE":
                      raise SystemExit(
                          f"{filename}: invalid action"
                      )

                  if not isinstance(rule["remote_addresses"], list):
                      raise SystemExit(
                          f"{filename}: remote_addresses is not a list"
                      )

                  challenge = rule["challenge"]

                  if not isinstance(challenge, dict):
                      raise SystemExit(
                          f"{filename}: challenge must be a mapping"
                      )

                  for key in ["difficulty", "algorithm"]:
                      if key not in challenge:
                          raise SystemExit(
                              f"{filename}: challenge is missing {key}"
                          )

                  if challenge["difficulty"] != 64:
                      raise SystemExit(
                          f"{filename}: invalid difficulty"
                      )

                  if challenge["algorithm"] != "fast":
                      raise SystemExit(
                          f"{filename}: invalid algorithm"
                      )

          print("YAML validation successful")
          PY

      - name: Commit changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add anubis/list/

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore: update Anubis blocklists"
          git push
